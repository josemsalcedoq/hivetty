name: package

# Builds unsigned packages (SP-7): .dmg on macOS, .deb + AppImage on Linux, .msi on Windows.
# Signing, notarization and publishing come later (release.yml, phase F6).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_CYCLONEDX_VERSION: 0.5.10

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: app,dmg
            artifacts: target/packages/*.dmg
          - os: ubuntu-24.04
            formats: deb,appimage
            artifacts: |
              target/packages/*.deb
              target/packages/*.AppImage
          - os: windows-latest
            formats: wix
            artifacts: target/packages/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p hv-app

      # macOS: one binary for Apple silicon and Intel (F6-07).
      - name: Build universal binary
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p hv-app --target aarch64-apple-darwin
          cargo build --release --locked -p hv-app --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/hivetty target/aarch64-apple-darwin/release/hivetty target/x86_64-apple-darwin/release/hivetty
          lipo -info target/universal-apple-darwin/release/hivetty

      - name: Bundle ConPTY next to the exe
        if: runner.os == 'Windows'
        run: cargo xtask conpty-fetch --profile release

      - name: Third-party notices
        run: cargo xtask notices

      - name: Package
        shell: bash
        run: >-
          cargo packager --release --manifest-path crates/hv-app/Cargo.toml
          ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
          --formats "${{ matrix.formats }}"
          --out-dir "$GITHUB_WORKSPACE/target/packages"

      - name: Register as x-terminal-emulator (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for deb in target/packages/*.deb; do
            sh crates/hv-app/packaging/deb-alternatives.sh "$deb"
            dpkg-deb -I "$deb" | grep -E "postinst|prerm"
          done

      - name: SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo cyclonedx --manifest-path crates/hv-app/Cargo.toml --format json --spec-version 1.5 --override-filename hivetty-sbom
          cp crates/hv-app/hivetty-sbom.json "target/packages/hivetty-${{ runner.os }}.cdx.json"

      - name: List packages
        shell: bash
        run: ls -la target/packages

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifacts }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hivetty-${{ runner.os }}-unsigned
          path: |
            ${{ matrix.artifacts }}
            target/packages/*.cdx.json
          if-no-files-found: error
