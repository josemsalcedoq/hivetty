name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libvulkan-dev mesa-vulkan-drivers

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: cargo-deny
        run: cargo deny check

      # Runs a real command in a PTY and renders it offscreen on this OS's GPU backend
      # (Metal on macOS, lavapipe Vulkan on Linux, DX12/WARP on Windows).
      - name: Headless render smoke test
        shell: bash
        # Same script on every OS (Git for Windows provides sh on the Windows runner).
        run: >-
          cargo run --locked -p hv-app --
          --screenshot "render-${RUNNER_OS}.png" --size 80x10 --wait 15
          -e sh "$PWD/tests/fixtures/render-smoke.sh"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-${{ runner.os }}
          path: render-*.png
          if-no-files-found: warn
