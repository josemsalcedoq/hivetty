name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hivetty --doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Ubuntu / Linux (X11), Ubuntu / Linux (Wayland), Windows 10, Windows 11]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version involved (if any)
      placeholder: e.g. Claude Code 2.1.300
