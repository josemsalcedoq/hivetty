[package]
name = "hv-app"
description = "The hivetty application binary: window, event loop and CLI subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hivetty"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
egui = "0.37"
egui-winit = { version = "0.37", features = ["accesskit"] }
env_logger = "0.11.12"
hv-agents = { version = "0.0.0", path = "../hv-agents" }
hv-config = { version = "0.0.0", path = "../hv-config" }
hv-ipc = { version = "0.0.0", path = "../hv-ipc" }
hv-platform = { version = "0.0.0", path = "../hv-platform" }
hv-pty = { version = "0.0.0", path = "../hv-pty" }
hv-render = { version = "0.0.0", path = "../hv-render" }
hv-shell = { version = "0.0.0", path = "../hv-shell" }
hv-term = { version = "0.0.0", path = "../hv-term" }
hv-ui = { version = "0.0.0", path = "../hv-ui" }
hv-usage = { version = "0.0.0", path = "../hv-usage" }
jiff = "1.0.2"
log = "0.4.35"
opener = "0.9.0"
png = "0.18.1"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

# Packaging with cargo-packager (SP-7, docs/spikes/SP-7.md). Paths are relative to this
# crate. The binaries come from `target/release`, built before `cargo packager --release`;
# the formats are chosen per OS on the command line (see .github/workflows/package.yml).
[package.metadata.packager]
product-name = "Hivetty"
identifier = "dev.hivetty.Hivetty"
description = "GPU-accelerated terminal with a sidebar for coding agents"
long-description = """
hivetty is a GPU-accelerated terminal for macOS, Linux and Windows with a sidebar \
that tracks coding agents and a usage dashboard."""
homepage = "https://github.com/josemsalcedoq/hivetty"
publisher = "hivetty"
authors = ["hivetty contributors"]
category = "DeveloperTool"
binaries = [{ path = "hivetty", main = true }]
icons = ["packaging/icon.png", "packaging/icon.ico"]
# Windows only: the bundled ConPTY that `cargo xtask conpty-fetch --profile release`
# installs next to the exe. On other OSes these globs match nothing. The MSI installs
# resources next to the executable.
resources = [
    "../../target/release/conpty.dll",
    "../../target/release/OpenConsole.exe",
    "../../THIRD_PARTY_NOTICES.md",
]

[package.metadata.packager.wix]
# Registers the AppUserModelID notifications use (F6-09).
fragment-paths = ["packaging/aumid.wxs"]
component-group-refs = ["HivettyAppUserModelId"]

[package.metadata.packager.deb]
package-name = "hivetty"
section = "x11"
# A terminal emulator entry (Categories=TerminalEmulator) instead of the generic one.
desktop-template = "packaging/hivetty.desktop.hbs"
