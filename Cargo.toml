[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josemsalcedoq/hivetty"


[workspace.lints.rust]
# `deny` (not `forbid`) so that hv-platform can opt out with #![allow(unsafe_code)].
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "warn"
large_futures = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
# Keep dependencies fast in debug builds (rendering and parsing are hot paths).
opt-level = 2
